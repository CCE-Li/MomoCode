[project]
name = "momocode-backend"
version = "0.1.0"
description = "MomoCode FastAPI backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "email-validator>=2.2,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "fsrs>=6.3,<7.0",
  "tzdata>=2025.1",
  "httpx>=0.28,<1.0",
  "redis>=5.2,<7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<2.0",
  "httpx>=0.28,<1.0",
  "aiosqlite>=0.20,<1.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S107"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
disallow_any_generics = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
